services:
  - type: web
    name: horizon-hrms-backend-python
    runtime: python
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./horizon.db
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        value: HorizonDev!2026
      - key: ENVIRONMENT
        value: Production

  - type: web
    name: horizon-hrms-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://horizon-hrms-backend-python.onrender.com/api