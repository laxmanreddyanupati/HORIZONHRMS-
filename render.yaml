# Backend only; the frontend is hosted on Cloudflare Pages.
services:
  - type: web
    name: horizon-hrms-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hosting__HttpsTerminatedAtProxy
        value: "true"
      - key: Auth__SigningKey
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Database__ApplyMigrations
        value: "true"
      - key: Seed__Enabled
        value: "false"
      - key: BootstrapAdmin__Enabled
        value: "true"
      - key: BootstrapAdmin__Email
        value: anupatilaxman2@gmail.com
      - key: BootstrapAdmin__Name
        value: Laxman Reddy Anupati
      - key: BootstrapAdmin__Password
        generateValue: true
