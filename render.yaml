services:
  - type: web
    name: horizon-hrms-backend-python
    runtime: docker
    dockerfilePath: ./backend-python/Dockerfile
    dockerContext: ./backend-python
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./horizon.db
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        value: HorizonDev!2026
      - key: ENVIRONMENT
        value: Production

  - type: web
    name: horizon-hrms-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://horizon-hrms-backend-python.onrender.com/api